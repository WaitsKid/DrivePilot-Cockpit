name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  dms-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dms-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dms-backend/requirements-stage5.txt
      - run: pip install -r requirements-stage5.txt
      - name: Test API, ROI, metrics and fatigue state machine
        run: >
          pytest -q
          tests/test_labels.py
          tests/test_stage3_thresholds.py
          tests/test_stage4_preprocess.py
          tests/test_stage4_roi.py
          tests/test_stage5_api_contract.py
          tests/test_stage5_fatigue_engine.py
          tests/test_stage5_status_store.py
          tests/test_training_metrics.py
